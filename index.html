<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Web Penyimpanan Berkas</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f4f6f8;
    }
    h1 {
      text-align: center;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    #clock {
      font-size: 18px;
      font-weight: bold;
    }
    button {
      padding: 8px 14px;
      cursor: pointer;
      border: none;
      background: #007bff;
      color: white;
      border-radius: 4px;
    }
    button:hover {
      background: #0056b3;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 6px;
      text-align: center;
    }
    th {
      background: #e9ecef;
    }
    th.no {
      width: 60px; /* No dibuat lebih lebar */
    }
    td[contenteditable="true"] {
      background: #fffbe6;
    }
    .aksi button {
      background: #dc3545;
    }
    .aksi button:hover {
      background: #b02a37;
    }
  </style>
</head>
<body>
  <h1>Web Penyimpanan Berkas</h1>

  <div class="top-bar">
    <div>
      <input type="file" id="excelFile" accept=".xlsx,.xls" />
      <button onclick="importExcel()">Import Excel</button>
      <button onclick="tambahBaris()">Tambah Data</button>
    </div>
    <div id="clock"></div>
  </div>

  <table id="dataTable">
    <thead>
      <tr>
        <th class="no">No</th>
        <th>Tanggal</th>
        <th>Direktur</th>
        <th>PT</th>
        <th>Desa</th>
        <th>Kecamatan</th>
        <th>Luas</th>
        <th>Peruntukan</th>
        <th>Aksi</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleString('id-ID');
    }
    setInterval(updateClock, 1000);
    updateClock();

    function refreshNo() {
      document.querySelectorAll('#dataTable tbody tr').forEach((row, index) => {
        row.cells[0].innerText = index + 1;
      });
    }

    function tambahBaris(data = []) {
      const tbody = document.querySelector('#dataTable tbody');
      const row = tbody.insertRow();

      for (let i = 0; i < 8; i++) {
        const cell = row.insertCell();
        if (i === 0) {
          cell.innerText = tbody.rows.length;
        } else {
          cell.contentEditable = true;
          cell.innerText = data[i - 1] || '';
        }
      }

      const aksi = row.insertCell();
      aksi.className = 'aksi';
      aksi.innerHTML = '<button onclick="hapusBaris(this)">Hapus</button>';
    }

    function hapusBaris(btn) {
      const row = btn.parentElement.parentElement;
      row.remove();
      refreshNo();
    }

    function importExcel() {
      const fileInput = document.getElementById('excelFile');
      if (!fileInput.files.length) {
        alert('Pilih file Excel terlebih dahulu');
        return;
      }

      const file = fileInput.files[0];
      const reader = new FileReader();

      reader.onload = function (e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const sheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[sheetName];
        const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

        const tbody = document.querySelector('#dataTable tbody');
        tbody.innerHTML = '';

        for (let i = 1; i < json.length; i++) {
          // urutan kolom Excel harus sesuai:
          // Tanggal, Direktur, PT, Desa, Kecamatan, Luas, Peruntukan
          tambahBaris(json[i]);
        }
        refreshNo();
      };

      reader.readAsArrayBuffer(file);
    }
  </script>
</body>
</html>
